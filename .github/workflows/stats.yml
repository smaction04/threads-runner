name: collect-stats
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-stats
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python collect_stats.py
      - name: save state
        if: always()
        run: |
          git config user.name "threads-runner"
          git config user.email "threads-runner@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "stats update" && git pull --rebase && git push)
