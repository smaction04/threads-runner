name: refill-queue
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=연습(저장 안 함), 0=실제 추가"
        default: "1"
permissions:
  contents: write
concurrency:
  group: post-due
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: sync to latest main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: refill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: python refill.py
      - name: save state
        if: always()
        run: |
          git config user.name "threads-runner"
          git config user.email "threads-runner@users.noreply.github.com"
          git add queue.json log.jsonl dash/dash_base.json
          git add -A -- refill_alert.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "refill queue" && git pull --rebase && git push)
